name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv publishes no floating major tag
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run --no-sync python -m pytest -q -o faulthandler_timeout=120  # a hung test dumps its stacks
        env:
          WHEELHOUSE_TEST_SIGNAL_LOG: ${{ runner.temp }}/signals.log   # [DIAG TEMP #188]
      - if: always()   # [DIAG TEMP #188] signals the tests' guard refused
        run: cat "${{ runner.temp }}/signals.log" 2>/dev/null || echo "no signals refused"
