name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv publishes no floating major tag
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run --no-sync python -m pytest -v --durations=30  # [DIAG TEMP #188]
