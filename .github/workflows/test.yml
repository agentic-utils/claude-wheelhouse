name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # setup-uv publishes no floating major tag
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: trace signals  # [DIAG TEMP #188] who signals the runner
        run: |
          sudo apt-get install -y -qq bpftrace > /dev/null
          cat > "$RUNNER_TEMP/sig.bt" <<'BT'
          tracepoint:signal:signal_generate /args->sig == 1 || args->sig == 2 || args->sig == 9 || args->sig == 15 || args->sig == 19 || args->sig == 20/ {
            printf("SIG %s sig=%d from pid=%d ppid=%d comm=%s -> pid=%d comm=%s\n", strftime("%H:%M:%S", nsecs), args->sig, pid, curtask->real_parent->tgid, comm, args->pid, args->comm);
            if (strncmp(args->comm, "hosted", 6) == 0 || strncmp(args->comm, "bash", 4) == 0) {
              system("ps -o pid,ppid,pgid,args -p %d,%d", pid, curtask->real_parent->tgid);
            }
          }
          tracepoint:syscalls:sys_enter_kill /args->pid <= 0 && args->sig != 0/ {
            printf("SIG %s kill(%d, %d) from pid=%d ppid=%d comm=%s\n", strftime("%H:%M:%S", nsecs), args->pid, args->sig, pid, curtask->real_parent->tgid, comm);
          }
          BT
          sudo nohup bpftrace -B line --unsafe "$RUNNER_TEMP/sig.bt" > "$RUNNER_TEMP/sig.log" 2>&1 &
          sleep 8
          cat "$RUNNER_TEMP/sig.log"
      - run: |  # [DIAG TEMP #188] tail: the post steps are skipped when the runner is signalled
          (tail -F "$RUNNER_TEMP/sig.log" | grep --line-buffered -v "comm=python3\? -> pid=[0-9]* comm=\(sleep\|python3\?\)$") &
          (while sleep 60; do ps -eo pid,ppid,pgid,sid,etimes,args --sort=etimes | awk '$5 > 300' | grep -v "ps -eo" | cut -c1-160 | sed 's/^/PS /'; echo PS --; done) &
          uv run --no-sync python -m pytest -q -o faulthandler_timeout=120
