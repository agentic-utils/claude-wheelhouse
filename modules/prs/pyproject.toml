[project]
name = "claude-wheelhouse-prs"
version = "0.2.0.dev0"
description = "The wheelhouse's PRs pane: open pull requests with a traffic light, from one cached GitHub query"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["claude-wheelhouse"]

[project.entry-points."claude_wheelhouse.modules"]
prs = "claude_wheelhouse_prs:module"

[tool.uv.sources]
claude-wheelhouse = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_wheelhouse_prs"]
