[project]
name = "claude-wheelhouse-stats"
version = "0.2.0.dev0"
description = "The wheelhouse's stats pane: a session's context, cache and token charts"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["claude-wheelhouse"]

[project.entry-points."claude_wheelhouse.modules"]
stats = "claude_wheelhouse_stats:module"

[tool.uv.sources]
claude-wheelhouse = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_wheelhouse_stats"]
