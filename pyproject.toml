[project]
name = "claude-wheelhouse"
version = "0.2.0.dev0"
description = "Sidecar for parallel Claude Code sessions: tasks, questions, lifecycle"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.164",
    "httpx2>=2.13",
    "mcp>=2.2",
    "sse-starlette>=3.5",
    "starlette>=1.7",
    "textual>=8.2",
    "uvicorn>=0.54",
]

[project.scripts]
claude-wheelhouse = "claude_wheelhouse.cli:main"

[dependency-groups]
dev = ["httpx2>=2.13", "pytest>=8", "pytest-xdist>=3.8"]
# the modules in this repo (modules/), a group each: installed unless left out, as make
# install WITH="..." does (.plan/modules.md)
stats = ["claude-wheelhouse-stats"]

[tool.uv]
default-groups = ["dev", "stats"]

[tool.uv.workspace]
members = ["modules/*"]

[tool.uv.sources]
claude-wheelhouse-stats = { workspace = true }

[tool.pytest.ini_options]
# in parallel, a worker a core (pytest-xdist); `-n 0` runs it serially
addopts = "-n auto"
testpaths = ["tests", "modules"]
pythonpath = ["."]   # tests.transcripts, which modules/stats/tests share
markers = ["both: runs through a hub in process (--local), and through the daemon, fetching at each refresh and on the client's own threads (conftest.via)"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_wheelhouse"]
artifacts = ["claude_wheelhouse/plugin/**"]
