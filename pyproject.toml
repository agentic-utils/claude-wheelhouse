[project]
name = "claude-wheelhouse"
version = "0.1.0"
description = "Sidecar for parallel Claude Code sessions: tasks, questions, lifecycle"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.164",
    "mcp>=2.2",
    "sse-starlette>=3.5",
    "starlette>=1.7",
    "textual>=8.2",
    "uvicorn>=0.54",
]

[project.scripts]
claude-wheelhouse = "claude_wheelhouse.cli:main"

[project.entry-points."claude_wheelhouse.modules"]
stats = "claude_wheelhouse.stats_pane:module"

[dependency-groups]
dev = ["httpx2>=2.13", "pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_wheelhouse"]
artifacts = ["claude_wheelhouse/plugin/**"]
